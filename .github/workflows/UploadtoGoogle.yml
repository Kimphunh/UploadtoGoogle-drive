name: Download File and Upload to Google Drive

on:
  workflow_dispatch: # Cho phép kích hoạt thủ công
    inputs:
      download_url:
        description: 'Link download file'
        required: true
      drive_folder_id:
        description: 'ID thư mục Google Drive để upload vào (tùy chọn, nếu trống sẽ upload vào root)'
        required: false
      output_filename:
        description: 'Tên file mong muốn trên Google Drive (tùy chọn, nếu trống sẽ dùng tên gốc)'
        required: false

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code # Cần thiết cho các bước tiếp theo hoạt động đúng ngữ cảnh
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure rclone
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }} # Lấy secret từ GitHub
        run: |
          mkdir -p ~/.config/rclone
          echo "[gdrive]" > ~/.config/rclone/rclone.conf
          echo "type = drive" >> ~/.config/rclone/rclone.conf
          echo "scope = drive" >> ~/.config/rclone/rclone.conf
          # Đường dẫn đến file service account key tạm thời
          echo "service_account_file = /tmp/gdrive_sa.json" >> ~/.config/rclone/rclone.conf
          # Ghi nội dung JSON từ secret vào file tạm
          echo "$GDRIVE_SA_JSON" > /tmp/gdrive_sa.json
          # Tùy chọn: Nếu bạn muốn upload vào một Team Drive (Shared Drive) cụ thể
          # echo "team_drive = YOUR_TEAM_DRIVE_ID" >> ~/.config/rclone/rclone.conf
          # Tùy chọn: Nếu biết ID thư mục gốc muốn rclone coi là root (hữu ích)
          # echo "root_folder_id = YOUR_ROOT_FOLDER_ID" >> ~/.config/rclone/rclone.conf

      - name: Download file
        run: |
          # Cố gắng lấy tên file từ URL, nếu không được đặt tên mặc định
          # Lưu ý: Cách lấy tên file này khá cơ bản, có thể cần điều chỉnh nếu URL phức tạp
          FILENAME=$(basename "${{ github.event.inputs.download_url }}")
          FILENAME="${FILENAME%%\?*}" # Loại bỏ query string nếu có
          if [[ -z "$FILENAME" || "$FILENAME" == "." ]]; then
            FILENAME="downloaded_file_$(date +%s)" # Đặt tên file duy nhất nếu không lấy được tên
          fi
          echo "Attempting to download as local file: $FILENAME"
          # Sử dụng curl để tải, theo dõi chuyển hướng (-L), ghi ra file (-o)
          curl -L -o "$FILENAME" "${{ github.event.inputs.download_url }}"
          # Kiểm tra xem file có được tải về không
          if [ ! -s "$FILENAME" ]; then
            echo "::error::Failed to download file or file is empty."
            exit 1
          fi
          echo "Downloaded file saved as: $FILENAME"
          # Lưu tên file đã tải vào biến môi trường để bước sau sử dụng
          echo "DOWNLOADED_FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Upload to Google Drive
        run: |
          # Xác định tên file trên Google Drive
          REMOTE_FILENAME="${{ github.event.inputs.output_filename }}"
          if [[ -z "$REMOTE_FILENAME" ]]; then
            REMOTE_FILENAME="${{ env.DOWNLOADED_FILENAME }}"
          fi

          # Xác định đường dẫn đích trên Google Drive
          DRIVE_PATH="gdrive:" # Mặc định là root (hoặc root_folder_id nếu cấu hình trong rclone.conf)
          if [[ "${{ github.event.inputs.drive_folder_id }}" != "" ]]; then
             # Sử dụng cú pháp của rclone để chỉ định thư mục bằng ID
             DRIVE_PATH="gdrive:{${{ github.event.inputs.drive_folder_id }}}/"
             echo "Targeting Google Drive Folder ID: ${{ github.event.inputs.drive_folder_id }}"
          else
             echo "Targeting Google Drive root (or configured root folder)."
          fi

          echo "Uploading '${{ env.DOWNLOADED_FILENAME }}' to '${DRIVE_PATH}${REMOTE_FILENAME}'"
          # Sử dụng rclone copy. -P để hiển thị tiến trình.
          # --drive-chunk-size có thể tăng để upload file lớn nhanh hơn (ví dụ 64M, 128M)
          # --drive-impersonate user@domain.com nếu cần mạo danh người dùng (thường dùng với domain-wide delegation)
          rclone copy "${{ env.DOWNLOADED_FILENAME }}" "${DRIVE_PATH}" --drive-chunk-size 64M -P --drive-stop-on-upload-limit

          # Kiểm tra lỗi upload của rclone
          if [ $? -ne 0 ]; then
            echo "::error::rclone upload failed."
            exit 1
          fi
          echo "Upload successful."
        # BƯỚC MỚI THÊM VÀO ĐỂ DEBUG
      - name: List files in target folder (Debug)
        if: always() # Luôn chạy để kiểm tra
        run: |
          TARGET_FOLDER_ID="14NkZglv1EZ7qTHvqGJv_bE7AGko2dqe7" # Thay ID đúng nếu cần
          echo "Listing contents of folder ID ${TARGET_FOLDER_ID}"
          # Lệnh lsf liệt kê tên file
          rclone lsf "gdrive:{${TARGET_FOLDER_ID}}/"
          echo "Checking specifically for the uploaded file:"
          # Lệnh ls liệt kê chi tiết file cụ thể (nếu tồn tại)
          rclone ls "gdrive:{${TARGET_FOLDER_ID}}/@aurevoir_178-2-%E4%B8%AD%E5%9B%BD%E5%8F%B0%E6%B9%BE-%E7%8C%B4_q6T2yQ.mp4"
        

      - name: Clean up downloaded file # Dọn dẹp file đã tải
        if: always() # Luôn chạy bước này, kể cả khi các bước trước thất bại
        run: |
          echo "Cleaning up local file: ${{ env.DOWNLOADED_FILENAME }}"
          rm -f "${{ env.DOWNLOADED_FILENAME }}"
          # Dọn dẹp file key SA tạm thời
          rm -f /tmp/gdrive_sa.json

